[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "speech-eval"
version = "0.1.0"
description = "语音评测工具集：ASR/TTS/SVS 常用评估指标"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [{ name = "speech-eval contributors" }]
keywords = ["speech", "evaluation", "tts", "asr", "svs", "metrics", "wer", "cer", "mcd"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "jiwer>=3.0.0",
    "librosa>=0.9.0",
    "pysptk>=0.2.0",
    "pyworld>=0.3.0",
    "soundfile>=0.12.0",
    "fastdtw>=0.3.0",
    "scipy>=1.7.0",
    "numpy>=1.21.0",
]

[project.optional-dependencies]
bert = ["discrete-speech-metrics", "torch"]
all = ["discrete-speech-metrics", "torch"]

[project.urls]
Homepage = "https://github.com/mahailiang5618/speech-eval"
Repository = "https://github.com/mahailiang5618/speech-eval"
Issues = "https://github.com/mahailiang5618/speech-eval/issues"
